<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>TimeChex</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Time<span>Chex</span></h1>
    <div class="status" id="status">Ready</div>
  </header>

  <main>
    <aside class="timeline" id="timeline"></aside>

    <section class="content">
      <div class="employee">
        <div>
          <div class="label">EMPLOYEE</div>
          <div class="name">Michael</div>
        </div>
        <div class="date" id="date"></div>
      </div>

      <div id="punch-card" class="card"></div>

      <div class="actions">
        <button id="btn-job" class="action">START JOB</button>
        <button id="btn-break" class="action">START BREAK</button>
        <button id="btn-drive" class="action">START DRIVE</button>
        <button id="btn-oops" class="action oops">OOPS PUNCH</button>
      </div>
    </section>
  </main>

  <nav>
    <span class="active">Punch</span>
    <span>Ticket</span>
    <span>Month</span>
    <span>Summary</span>
  </nav>

  <!-- Oops Punch Modal -->
  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <h3>Oops Punch</h3>
      <label>Time <input type="time" id="oops-time"></label>
      <label>Type
        <select id="oops-type">
          <option>Start Job</option>
          <option>Stop Job</option>
          <option>Start Break</option>
          <option>Stop Break</option>
          <option>Start Drive</option>
          <option>Stop Drive</option>
        </select>
      </label>
      <label>Job
        <select id="oops-job"></select>
      </label>
      <label>Notes <textarea id="oops-notes" rows="2"></textarea></label>
      <label>Parts <input id="oops-parts" placeholder="part numbers, comma separated"></label>
      <div class="modal-actions">
        <button id="oops-cancel">Cancel</button>
        <button id="oops-save" class="primary">Add Punch</button>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
