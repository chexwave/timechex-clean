<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TimeChex — Punch Demo</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; padding: 1rem; }
    .rings { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; max-width: 400px; margin: 1rem auto; }
    .ring { width: 140px; height: 140px; border-radius: 50%; border: 8px solid #334155; display: flex; align-items: center; justify-content: center; font-weight: bold; text-align: center; cursor: pointer; user-select: none; }
    .start { border-color: #22c55e; background: #14532d; }
    .stop { border-color: #ef4444; background: #7f1d1d; }
    .log { max-width: 500px; margin: 1rem auto; }
    .punch { padding: 0.5rem; border-bottom: 1px solid #334155; font-family: monospace; }
    h1 { text-align: center; letter-spacing: 0.1em; }
  </style>
</head>
<body>
  <h1>TIMEC HEX</h1>
  <p style="text-align:center">Mock punch flow — punch ID is the attachment key</p>

  <div class="rings">
    <div class="ring start" onclick="punch('Start Job')">START<br>JOB</div>
    <div class="ring stop" onclick="punch('Stop Job')">STOP<br>JOB</div>
    <div class="ring start" onclick="punch('Start Break')">START<br>BREAK</div>
    <div class="ring stop" onclick="punch('End Break')">END<br>BREAK</div>
  </div>

  <div class="log" id="log"></div>

  <script type="module">
    import { generatePunchId, MOCK_CUSTOMERS, MOCK_JOBS, LABOR_RATES } from './src/mock-data.js';

    const log = document.getElementById('log');
    const punches = JSON.parse(localStorage.getItem('timechex-punches') || '[]');

    function render() {
      log.innerHTML = punches.slice().reverse().map(p =>
        `<div class="punch">${p.time} · ${p.type} · <strong>${p.id}</strong> · ${p.wo || 'unattached'}</div>`
      ).join('') || '<p style="text-align:center">No punches yet. Hit a ring.</p>';
    }

    window.punch = (type) => {
      const now = new Date();
      const punch = {
        id: generatePunchId(now),
        iso: now.toISOString().slice(0,10),
        time: now.toTimeString().slice(0,5),
        type,
        wo: MOCK_JOBS[0].number,
        customer: MOCK_CUSTOMERS[0].name,
        attached: false
      };
      punches.push(punch);
      localStorage.setItem('timechex-punches', JSON.stringify(punches));
      render();
    };

    render();
    console.log('Rates locked:', LABOR_RATES);
  </script>
</body>
</html>
