<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>TimeChex</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Time<span>Chex</span></h1>
    <span class="version">v0.29</span>
  </header>

  <div class="status-bar" id="status-bar">
    <span class="dot-live"></span>
    <span id="status-text">Ready</span>
    <span id="timer">00:00:00</span>
  </div>

  <div id="toast" class="toast hidden"></div>

  <main id="main">
    <!-- Punch view (default) -->
    <div id="view-punch">
      <aside class="timeline" id="timeline"></aside>
      <section class="content">
        <div class="employee">
          <div>
            <div class="label">EMPLOYEE</div>
            <div class="name">Michael</div>
            <div class="sub" id="job-sub">No active job</div>
          </div>
          <div class="date-block">
            <div class="label">DATE</div>
            <div class="date" id="date"></div>
            <div class="clock" id="clock"></div>
          </div>
        </div>
        <div id="punch-card" class="card"></div>
        <div class="actions">
          <div class="action-wrap">
            <button id="btn-job" class="action ring">START<br>JOB</button>
            <div class="helper" id="helper-job"></div>
          </div>
          <div class="action-wrap">
            <button id="btn-break" class="action ring">START<br>BREAK</button>
            <div class="helper" id="helper-break"></div>
          </div>
          <div class="action-wrap">
            <button id="btn-drive" class="action ring">START<br>DRIVE</button>
            <div class="helper" id="helper-drive"></div>
          </div>
          <div class="action-wrap">
            <button id="btn-oops" class="action ring oops">OOPS<br>PUNCH</button>
            <div class="helper" id="helper-oops">Manual punch</div>
          </div>
        </div>
        <div class="add-row">
          <button id="btn-add-part" class="add-btn">Add part</button>
          <button id="btn-add-note" class="add-btn">Add note</button>
        </div>
        <div class="log-strip">
          <div class="label">TODAY'S LOG</div>
          <div id="today-log"></div>
        </div>
      </section>
    </div>

    <!-- Ticket view -->
    <div id="view-ticket" class="hidden">
      <section class="content" style="width:100%">
        <h2>Today's Timesheet</h2>
        <div id="ticket-content" class="card"></div>
        <button id="btn-export" class="primary" style="margin-top:1rem;padding:0.6rem 1.2rem;border-radius:8px;border:none;background:#ef4444;color:#fff">Export by Punch ID</button>
      </section>
    </div>

    <!-- Month view -->
    <div id="view-month" class="hidden">
      <section class="content" style="width:100%">
        <div id="month-content"></div>
      </section>
    </div>

    <!-- Summary view -->
    <div id="view-summary" class="hidden">
      <section class="content" style="width:100%">
        <div id="summary-content"></div>
      </section>
    </div>
  </main>

  <nav>
    <span data-view="punch" class="active">Punch</span>
    <span data-view="ticket">Ticket</span>
    <span data-view="month">Month</span>
    <span data-view="summary">Summary</span>
  </nav>

  <!-- Oops modal -->
  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <h3>Oops Punch</h3>
      <label>Time <input type="time" id="oops-time"></label>
      <label>Type
        <select id="oops-type">
          <option>Start Job</option>
          <option>Stop Job</option>
          <option>Start Break</option>
          <option>Stop Break</option>
          <option>Start Drive</option>
          <option>Stop Drive</option>
        </select>
      </label>
      <label>Job <select id="oops-job"></select></label>
      <label>Notes <textarea id="oops-notes" rows="2"></textarea></label>
      <label>Parts <input id="oops-parts" placeholder="part numbers, comma separated"></label>
      <label>Distance (mi, for Drive) <input type="number" id="oops-distance" step="0.1" value="0"></label>
      <div class="modal-actions">
        <button id="oops-cancel">Cancel</button>
        <button id="oops-save" class="primary">Add Punch</button>
      </div>
    </div>
  </div>

  <!-- Edit modal -->
  <div id="edit-modal" class="modal hidden">
    <div class="modal-content">
      <h3>Edit Punch</h3>
      <label>Time <input type="time" id="edit-time"></label>
      <label>Type
        <select id="edit-type">
          <option>Start Job</option>
          <option>Stop Job</option>
          <option>Start Break</option>
          <option>Stop Break</option>
          <option>Start Drive</option>
          <option>Stop Drive</option>
        </select>
      </label>
      <label>Job <select id="edit-job"></select></label>
      <label>Notes <textarea id="edit-notes" rows="2"></textarea></label>
      <label>Parts <input id="edit-parts" placeholder="part numbers"></label>
      <label>Distance (mi) <input type="number" id="edit-distance" step="0.1" value="0"></label>
      <div class="modal-actions">
        <button id="edit-cancel">Cancel</button>
        <button id="edit-save" class="primary">Save</button>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
